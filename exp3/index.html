<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050b18">
    <meta
      name="description"
      content="星尘遗迹：用 async/await 驱动的异步寻宝动画。跟随机械萤火虫小烛，穿越风之回廊，找到星之种。"
    >
    <title>星尘遗迹 · 异步寻宝</title>
    <link rel="stylesheet" href="style.css">
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050b18'/%3E%3Cpath d='M32 8l5.6 18.4L56 32l-18.4 5.6L32 56l-5.6-18.4L8 32l18.4-5.6z' fill='%23ffd27a'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23fff7dc'/%3E%3C/svg%3E"
    >
  </head>

  <body>
    <div class="page">
      <canvas id="sky" aria-hidden="true"></canvas>
      <div class="aurora" aria-hidden="true"></div>

      <header class="topbar">
        <a class="brand" href="./" aria-label="星尘遗迹首页">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span class="brand-text">
            星尘遗迹
            <small>THE STARDUST RELIC</small>
          </span>
        </a>

        <div class="top-meta">
          <span class="tech-pill">ASYNC / AWAIT</span>
          <span class="chapter-counter" id="chapterCounter">00 / 06</span>
        </div>
      </header>

      <div class="scene" id="scene" data-stage="0" aria-hidden="true">
        <svg
          class="world"
          viewBox="0 0 1200 800"
          preserveAspectRatio="xMidYMid slice"
          xmlns="http://www.w3.org/2000/svg"
        >
          <defs>
            <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffe7ad" stop-opacity="0.5" />
              <stop offset="45%" stop-color="#8ecfd1" stop-opacity="0.14" />
              <stop offset="100%" stop-color="#8ecfd1" stop-opacity="0" />
            </radialGradient>

            <linearGradient id="islandRock" x1="0" y1="0" x2="0.3" y2="1">
              <stop offset="0%" stop-color="#38515a" />
              <stop offset="45%" stop-color="#1d3039" />
              <stop offset="100%" stop-color="#09131b" />
            </linearGradient>

            <linearGradient id="islandTop" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#8ae3bd" />
              <stop offset="48%" stop-color="#2e9e86" />
              <stop offset="100%" stop-color="#155d5f" />
            </linearGradient>

            <linearGradient id="domeCopper" x1="0" y1="0" x2="0.8" y2="1">
              <stop offset="0%" stop-color="#ffe1a0" />
              <stop offset="55%" stop-color="#c88a45" />
              <stop offset="100%" stop-color="#704224" />
            </linearGradient>

            <linearGradient id="chestGold" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffe6a1" />
              <stop offset="50%" stop-color="#d7a34c" />
              <stop offset="100%" stop-color="#825022" />
            </linearGradient>

            <linearGradient id="beamGradient" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#ffe7a3" stop-opacity="0.9" />
              <stop offset="55%" stop-color="#8bf3d4" stop-opacity="0.2" />
              <stop offset="100%" stop-color="#8bf3d4" stop-opacity="0" />
            </linearGradient>

            <radialGradient id="fireflyHalo">
              <stop offset="0%" stop-color="#fffbe0" stop-opacity="1" />
              <stop offset="25%" stop-color="#ffe083" stop-opacity="0.8" />
              <stop offset="100%" stop-color="#ffd36f" stop-opacity="0" />
            </radialGradient>

            <radialGradient id="chestHalo">
              <stop offset="0%" stop-color="#ffe6a2" stop-opacity="0.5" />
              <stop offset="100%" stop-color="#ffe6a2" stop-opacity="0" />
            </radialGradient>

            <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
              <feGaussianBlur stdDeviation="5" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>

            <filter id="cloudBlur" x="-20%" y="-50%" width="140%" height="200%">
              <feGaussianBlur stdDeviation="12" />
            </filter>
          </defs>

          <!-- 星图 -->
          <g class="constellation">
            <path
              class="constellation-line"
              pathLength="1"
              d="M 544 162 L 614 108 L 688 164 L 760 112 L 840 178 L 916 128"
            />
            <path
              class="constellation-line"
              pathLength="1"
              d="M 688 164 L 720 248 L 840 178"
            />
            <g class="constellation-stars">
              <circle cx="544" cy="162" r="3.4" />
              <circle cx="614" cy="108" r="4.2" />
              <circle cx="688" cy="164" r="3" />
              <circle cx="760" cy="112" r="4.8" />
              <circle cx="840" cy="178" r="3.4" />
              <circle cx="916" cy="128" r="3" />
              <circle cx="720" cy="248" r="2.6" />
            </g>
            <circle class="constellation-ring" cx="730" cy="170" r="142" />
          </g>

          <!-- 月亮 -->
          <g class="moon">
            <circle cx="1010" cy="142" r="138" fill="url(#moonHalo)" />
            <circle cx="1010" cy="142" r="63" fill="#f4e8c8" />
            <circle cx="990" cy="126" r="13" fill="#dfd0ad" opacity="0.45" />
            <circle cx="1028" cy="164" r="8" fill="#dfd0ad" opacity="0.35" />
            <circle cx="1036" cy="116" r="5" fill="#dfd0ad" opacity="0.3" />
          </g>

          <!-- 云层 -->
          <g class="clouds">
            <g class="cloud cloud-one" filter="url(#cloudBlur)">
              <ellipse cx="240" cy="360" rx="190" ry="35" />
              <ellipse cx="340" cy="338" rx="130" ry="28" />
              <ellipse cx="920" cy="318" rx="180" ry="30" />
            </g>
            <g class="cloud cloud-two" filter="url(#cloudBlur)">
              <ellipse cx="760" cy="660" rx="280" ry="42" />
              <ellipse cx="520" cy="690" rx="180" ry="30" />
            </g>
          </g>

          <!-- 浮空岛 -->
          <g class="island-group">
            <ellipse class="island-under-glow" cx="760" cy="590" rx="330" ry="190" />

            <path
              class="island-cliff"
              d="M 460 520
                 C 468 586 504 625 548 648
                 C 570 690 588 712 614 730
                 L 642 694
                 L 676 754
                 L 714 702
                 L 758 766
                 L 803 700
                 L 840 746
                 L 878 686
                 L 921 726
                 L 951 658
                 C 1002 634 1044 588 1060 520
                 C 908 578 618 578 460 520 Z"
            />

            <path
              class="island-rock-line"
              d="M 500 584 C 602 626 908 630 1018 576"
            />
            <path
              class="island-rock-line second"
              d="M 536 646 C 640 682 862 680 972 630"
            />
            <path
              class="island-rock-line third"
              d="M 594 704 C 674 730 846 730 916 700"
            />

            <ellipse class="island-top" cx="760" cy="520" rx="300" ry="58" />
            <ellipse class="island-top-rim" cx="760" cy="520" rx="300" ry="58" />

            <!-- 岛上小径 -->
            <path
              class="island-path"
              d="M 520 522 C 610 548 700 540 790 526 C 838 518 862 514 892 508"
            />

            <!-- 观星台 -->
            <g class="observatory">
              <ellipse class="observatory-halo" cx="612" cy="390" rx="122" ry="108" />
              <rect class="tower" x="565" y="405" width="92" height="116" rx="10" />
              <rect class="tower-band" x="558" y="500" width="106" height="15" rx="6" />
              <path class="dome" d="M 551 406 C 565 340 659 340 673 406 Z" />
              <path class="dome-rib" d="M 612 348 L 612 404" />
              <path class="dome-rib" d="M 572 368 C 594 356 630 356 652 368" />
              <path class="antenna" d="M 612 348 L 612 322" />
              <circle class="antenna-light" cx="612" cy="318" r="3.5" />
              <circle class="observatory-window" cx="612" cy="382" r="14" />
              <rect class="tower-window" x="600" y="437" width="24" height="36" rx="12" />
              <rect class="observatory-door" x="596" y="486" width="32" height="35" rx="4" />
            </g>

            <!-- 神庙拱门 -->
            <g class="temple">
              <path class="temple-arch" d="M 790 514 L 790 408 Q 858 336 932 408 L 932 514" />
              <path class="temple-arch-glow" d="M 790 514 L 790 408 Q 858 336 932 408 L 932 514" />
              <path class="temple-inner" d="M 804 514 L 804 414 Q 858 360 918 414 L 918 514 Z" />

              <g class="temple-runes">
                <path d="M 810 432 l 8 -10 l 8 10 l -8 10 z" />
                <circle cx="858" cy="390" r="5" />
                <path d="M 896 432 l 8 10 l 8 -10 l -8 -10 z" />
              </g>
            </g>

            <!-- 宝箱 -->
            <g class="chest">
              <circle class="chest-halo" cx="852" cy="494" rx="112" ry="90" />
              <path class="treasure-beam" d="M 812 500 L 892 500 L 958 120 L 746 120 Z" />
              <rect class="chest-base" x="802" y="496" width="100" height="52" rx="9" />
              <rect class="chest-band" x="832" y="496" width="9" height="52" />
              <rect class="chest-band" x="865" y="496" width="9" height="52" />
              <g class="chest-lid">
                <path d="M 799 498 Q 852 462 905 498 Z" />
                <path class="chest-lid-band" d="M 849 470 L 855 499" />
                <rect class="chest-lock" x="843" y="490" width="18" height="18" rx="4" />
              </g>
              <g class="star-seed">
                <circle cx="852" cy="430" r="26" />
                <circle cx="852" cy="430" r="5" />
                <path d="M 852 388 L 858 421 L 892 430 L 858 440 L 852 474 L 846 440 L 812 430 L 846 421 Z" />
              </g>
            </g>

            <!-- 守护石像 -->
            <g class="guardian">
              <path d="M 695 520 L 695 456 Q 695 432 719 432 L 746 432 L 746 520 Z" />
              <circle cx="719" cy="421" r="12" />
              <path class="guardian-eye" d="M 712 421 Q 719 416 726 421 Q 719 426 712 421 Z" />
            </g>

            <!-- 环绕宝箱的符文 -->
            <g class="rune-ring">
              <circle cx="852" cy="521" r="88" />
              <path d="M 852 433 l 6 10 l -6 10 l -6 -10 z" />
              <path d="M 940 521 l -10 6 l -10 -6 l 10 -6 z" />
              <path d="M 852 609 l -6 -10 l 6 -10 l 6 10 z" />
              <path d="M 764 521 l 10 -6 l 10 6 l -10 6 z" />
            </g>

            <ellipse class="island-runes" cx="760" cy="744" rx="190" ry="26" />
          </g>

          <!-- 风 -->
          <g class="wind">
            <path class="wind-line one" d="M 420 430 C 520 390 610 448 700 404 C 790 360 890 404 1000 350" />
            <path class="wind-line two" d="M 360 500 C 500 460 600 520 740 470 C 860 428 950 472 1050 424" />
            <path class="wind-line three" d="M 450 580 C 580 540 690 590 820 548 C 910 518 990 550 1080 510" />
          </g>

          <!-- 最终星尘 -->
          <g class="finale-sparkles">
            <circle cx="600" cy="300" r="2.5" />
            <circle cx="760" cy="210" r="2" />
            <circle cx="980" cy="280" r="3" />
            <circle cx="700" cy="160" r="2" />
            <circle cx="1060" cy="370" r="2.4" />
            <circle cx="470" cy="250" r="2" />
            <circle cx="840" cy="120" r="2.8" />
            <circle cx="1120" cy="220" r="1.8" />
          </g>

          <!-- 萤火虫 -->
          <g id="firefly" class="firefly">
            <circle class="firefly-halo" cx="0" cy="0" r="34" />
            <circle class="firefly-glow" cx="0" cy="0" r="12" />
            <circle class="firefly-core" cx="0" cy="0" r="3.6" />
            <circle class="firefly-trail" cx="-12" cy="4" r="2.2" />
            <circle class="firefly-trail second" cx="-22" cy="8" r="1.4" />
          </g>

          <!-- 萤火虫的隐藏路径 -->
          <path
            id="journeyPath"
            d="M 430 610 C 470 520 535 500 594 516 C 654 532 684 468 742 474 C 804 480 824 452 866 480"
            fill="none"
            stroke="none"
          />
        </svg>

        <div class="scene-caption">
          <span class="caption-line"></span>
          <span id="sceneCaption">风停之夜 · 云端群岛</span>
        </div>
      </div>

      <main class="story">
        <div class="progress-track" aria-hidden="true">
          <span class="progress-fill" id="progressFill"></span>
        </div>

        <p class="eyebrow" id="stageEyebrow">序章 · 风停之夜</p>
        <h1 id="stageTitle">星尘遗迹</h1>
        <p class="story-text" id="storyText">
          云端群岛的灯塔熄灭了一百年。今晚，一只机械萤火虫落在你的窗台，
          带来一张缺了角的星图。
        </p>

        <div class="story-actions">
          <button class="primary" id="startBtn" type="button">
            <span id="startLabel">跟随小烛出发</span>
            <span aria-hidden="true">→</span>
          </button>
          <button class="ghost" id="replayBtn" type="button" hidden>
            重新体验
          </button>
        </div>

        <section class="log-wrap" aria-label="航海日志">
          <p class="log-title">
            航海日志
            <span class="status-dot" id="statusDot"></span>
          </p>
          <ol class="log" id="log"></ol>
        </section>

        <footer class="story-footer">
          <span>6 CHAPTERS · 1 ASYNC FLOW</span>
          <span>PROMISE → AWAIT</span>
        </footer>
      </main>

      <p class="sr-only" id="liveStatus" aria-live="polite"></p>
    </div>

    <noscript>
      <p class="noscript">这个寻宝动画需要启用 JavaScript 才能运行。</p>
    </noscript>

    <script src="treasure-async.js"></script>
    <script src="app.js"></script>
  </body>
</html>
